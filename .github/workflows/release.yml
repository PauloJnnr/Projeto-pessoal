name: Publicar PIW Client

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Configurar repositorio da Release
        run: npm pkg set build.publish.owner="${{ github.repository_owner }}" build.publish.repo="${{ github.event.repository.name }}"

      - name: Construir instalador
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PIW Client ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release/latest.yml
            release/PIW-Client-Setup-*.exe
            release/PIW-Client-Setup-*.blockmap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
